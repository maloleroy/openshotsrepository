[project]
name = "openshots"
version = "0.2.0"
description = "Shared dynamic database of quantum computing circuit shots on real hardware - Open data for quantum computing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "qiskit>=2.3,<3",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.43.1"]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.30.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openshots"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["openshots"]
